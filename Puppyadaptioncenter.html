<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppy Adoption Center</title>
</head>
<body>
    <h1>Puppy Adoption Center</h1>
    <form>
        <label for="Fname">First Name:</label>
        <input type="text" id="Fname" name="Fname" placeholder="Enter your first name">
        <label for="Lname">Last Name:</label>
        <input type="text" id="Lname" name="Lname" placeholder="Enter your last name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>
        <p>Are you over the age of 18?</p>
        <input type="radio" id="yes" name="age" value="yes">
        <label for="yes">Yes</label>
        <input type="radio" id="no" name="age" value="no">
        <label for="no">No</label><br><br>
        <p> Do you have Credit Card or PayPal?</p>
        <label for="payment">Payment Method:</label>
        <select id="payment" name="payment">
            <option value="credit">Credit Card</option>
            <option value="paypal">PayPal</option>
        </select><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
